# compose.yaml — production-стек для inteli-dev.ru.
#
# Трафик: клиент → Traefik (TLS, сжатие, www→apex) → nginx → web.
# Контейнеры и тома с префиксом inteli-dev-prod, чтобы production можно было
# держать рядом с dev-стеком на одном Docker-хосте.
#
# Запуск:
#   cp .env.prod.example .env.prod   # заполнить секреты
#   docker compose up -d --build
#
# Требуется один раз создать внешние сети:
#   docker network create traefik-public
#   docker network create inteli-dev-assistant
#
# Внешние образы закреплены digest-ами, чтобы перезапуск не подтянул
# несовместимый тег. Обновление — осознанная замена digest + `docker compose pull`.

name: inteli-dev-prod

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-0.1.0}
    image: inteli-dev-prod:${APP_VERSION:-0.1.0}
    container_name: inteli-dev-prod-web
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      PORT: "8080"
      CONFIG_PATH: /app/config.toml
      OPENVIKING_BASE_URL: http://viking:1933/mcp
      DATA_DIR: /data
      DB_PATH: /data/chats.db
      KERNEL_URL: http://kernel:8080
      KERNEL_CHANNEL: site
    volumes:
      - db-data:/data
      - ./config/config.prod.toml:/app/config.toml:ro
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    networks:
      - internal
      - assistant

  nginx:
    # nginx:1.27-alpine, digest на момент подготовки production-стека.
    image: nginx@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    container_name: inteli-dev-prod-nginx
    restart: unless-stopped
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - internal
      - traefik-public
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public

      # HTTPS-роутер: автоматический выпуск сертификата Let's Encrypt.
      - traefik.http.routers.inteli-dev.rule=Host(`inteli-dev.ru`)
      - traefik.http.routers.inteli-dev.entrypoints=websecure
      - traefik.http.routers.inteli-dev.tls=true
      - traefik.http.routers.inteli-dev.tls.certresolver=letsencrypt
      - traefik.http.routers.inteli-dev.service=inteli-dev
      - traefik.http.services.inteli-dev.loadbalancer.server.port=80

      # www обслуживается отдельным TLS-роутером: свой сертификат можно
      # выпустить независимо от apex. Пока DNS www не переключён, apex-сертификат
      # всё равно выпускается.
      - traefik.http.routers.inteli-dev-www.rule=Host(`www.inteli-dev.ru`)
      - traefik.http.routers.inteli-dev-www.entrypoints=websecure
      - traefik.http.routers.inteli-dev-www.tls=true
      - traefik.http.routers.inteli-dev-www.tls.certresolver=letsencrypt
      - traefik.http.routers.inteli-dev-www.service=inteli-dev
      - traefik.http.routers.inteli-dev-www.middlewares=inteli-dev-www-to-apex,inteli-dev-compress

      # HTTP-роутер: редирект на HTTPS. ACME HTTP-01 не редиректим:
      # иначе Let's Encrypt получает 301 вместо challenge-токена.
      - traefik.http.routers.inteli-dev-http.rule=(Host(`inteli-dev.ru`) || Host(`www.inteli-dev.ru`)) && !PathPrefix(`/.well-known/acme-challenge/`)
      - traefik.http.routers.inteli-dev-http.entrypoints=web
      - traefik.http.routers.inteli-dev-http.middlewares=inteli-dev-redirect-https
      - traefik.http.middlewares.inteli-dev-redirect-https.redirectscheme.scheme=https
      - traefik.http.middlewares.inteli-dev-redirect-https.redirectscheme.permanent=true

      # www → apex: канонический домен для SEO.
      # Сжатие — здесь, а не в nginx: Traefik умеет brotli и zstd, а nginx в
      # этом образе только gzip. Порядок `br,zstd,gzip` задаёт приоритет.
      - traefik.http.routers.inteli-dev.middlewares=inteli-dev-www-to-apex,inteli-dev-compress
      - traefik.http.middlewares.inteli-dev-www-to-apex.redirectregex.regex=^https?://www\.inteli-dev\.ru/(.*)
      - traefik.http.middlewares.inteli-dev-www-to-apex.redirectregex.replacement=https://inteli-dev.ru/$$1
      - traefik.http.middlewares.inteli-dev-www-to-apex.redirectregex.permanent=true
      - traefik.http.middlewares.inteli-dev-compress.compress=true
      - traefik.http.middlewares.inteli-dev-compress.compress.encodings=br,zstd,gzip

  redis:
    # redis:7-alpine, digest на момент подготовки production-стека.
    image: redis@sha256:892022f9f18c26c92c30e15194d132f90044af87b94a491a75429bbc3982eab1
    container_name: inteli-dev-prod-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    volumes:
      - redis-data:/data
    networks:
      - internal

networks:
  internal:
    driver: bridge
  traefik-public:
    external: true
    name: traefik-public
  assistant:
    external: true
    name: inteli-dev-assistant

volumes:
  db-data:
    name: inteli-dev-prod_db-data
  redis-data:
    name: inteli-dev-prod_redis-data
