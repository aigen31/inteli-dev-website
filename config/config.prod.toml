# config/config.prod.toml — продакшен-конфигурация приложения (без секретов).
#
# Монтируется в контейнер как /app/config.toml (read-only) — см.
# docker-compose.prod.yml. Секреты (LLM_API_KEY, TELEGRAM_*, VK_*, ADMIN_TOKEN)
# подставляются из переменных окружения (.env.prod) и здесь не хранятся.

[server]
host = "0.0.0.0"
port = 8080
read_timeout_ms = 5000
write_timeout_ms = 30000

[database]
path = "/data/chats.db"        # дублируется env DB_PATH

[cache]
enabled = true
ttl_seconds = 3600

[openviking]
base_url = "http://viking:1933/mcp"
timeout_seconds = 5
read_timeout_seconds = 5

[llm]
provider = "deepseek"
base_url = "https://api.deepseek.com/v1"
model = "deepseek-chat"
max_tokens = 600               # потолок выходных токенов
temperature = 0.7
context_top_k = 4              # бюджет RAG-контекста (экономия входных токенов)
context_snippet_chars = 400
context_max_chars = 1600
context_min_score = 0.35

[telegram]
bot_token = ""                 # env TELEGRAM_BOT_TOKEN
admin_chat_id = 0              # env TELEGRAM_ADMIN_CHAT_ID

[vk]
oauth_token = ""               # env VK_OAUTH_TOKEN
admin_user_id = 0              # env VK_ADMIN_USER_ID

[admin]
token = ""                     # env ADMIN_TOKEN

[ratelimit]
max_requests_per_minute = 10   # технический антифлуд (все типы запросов)
window_seconds = 60

[limits]
# Пользовательские лимиты: те же числа уходят в UI и в серверную валидацию.
chat_message_max_chars = 500
llm_requests_per_hour = 3      # AI-ответов на посетителя в час
lead_name_max_chars = 80
lead_message_max_chars = 1000
lead_phone_max_chars = 20

[logging]
level = "warn"                 # env RUST_LOG

[security]
ip_hash_algorithm = "sha256"
