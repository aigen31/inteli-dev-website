<div class="scene" id="crm-lab-scene">
    <div class="scene-bg" aria-hidden="true"></div>
    <div class="aurora aurora-a" aria-hidden="true"></div>
    <div class="aurora aurora-b" aria-hidden="true"></div>
    <div class="grid-floor" aria-hidden="true"></div>
    <canvas id="crm-lab-particles" aria-hidden="true"></canvas>
    <div class="scanlines" aria-hidden="true"></div>
    <div class="vignette" aria-hidden="true"></div>



    <div class="stage" id="stage" aria-label="Анимированная иллюстрация: Кики парит над контуром CRM">
        <div class="stage-coords mono" aria-hidden="true">
            <span>X 55.0</span><span>Y 48.0</span><span>Z 04</span>
        </div>

        <div class="core-glow" aria-hidden="true"></div>

        <div class="satellites" aria-hidden="true">
            <span style="--a: 12deg; --r: 236px"></span>
            <span style="--a: 76deg; --r: 272px"></span>
            <span style="--a: 142deg; --r: 224px"></span>
            <span style="--a: 208deg; --r: 284px"></span>
            <span style="--a: 266deg; --r: 238px"></span>
            <span style="--a: 322deg; --r: 264px"></span>
        </div>

        <div class="pedestal" aria-hidden="true">
            <span class="pedestal-ring pedestal-a"></span>
            <span class="pedestal-ring pedestal-b"></span>
            <span class="pedestal-ring pedestal-c"></span>
            <span class="pedestal-core"></span>
            <span class="pedestal-tick tick-a"></span>
            <span class="pedestal-tick tick-b"></span>
            <span class="pedestal-tick tick-c"></span>
            <span class="pedestal-tick tick-d"></span>
        </div>

        <div class="rings" aria-hidden="true">
            <div class="ring ring-a"></div>
            <div class="ring ring-b"></div>
            <div class="ring ring-c"></div>
            <div class="ring-ticks"></div>
            <div class="ring-cross ring-cross-x"></div>
            <div class="ring-cross ring-cross-y"></div>
        </div>

        <svg class="connectors" id="connectors" viewBox="0 0 1440 900" preserveAspectRatio="none" aria-hidden="true">
            <path class="connector" d="M420 210 C 600 260, 720 330, 830 390"/>
            <path class="connector" d="M300 470 C 480 470, 660 450, 790 425"/>
            <path class="connector" d="M1270 240 C 1120 300, 1010 350, 910 395"/>
            <path class="connector" d="M1300 500 C 1160 490, 1040 450, 950 425"/>
            <path class="connector" d="M500 730 C 600 650, 710 540, 820 470"/>
        </svg>

        <div class="kiki-wrap" id="kiki-wrap">
            <div class="kiki-halo" aria-hidden="true"></div>
            <div class="kiki-shadow" aria-hidden="true"></div>
            <img id="crm-lab-kiki" src="/assets/crm/kiki-crm-lotus.webp" alt="Кики парит в воздухе" width="1440" height="1440" draggable="false"/>
            <span class="kiki-tag mono">KIKI / ORBITAL</span>
        </div>

        <article class="float-card card-task" data-depth="0.45" style="--delay: 0.5s">
            <header><span class="mono">TASK / 018</span><span class="status-dot"></span></header>
            <strong>Лендинг для кофейни</strong>
            <span class="bar"><i style="width:64%"></i></span>
            <footer><span class="mono">KOR-18</span><span class="mono">64%</span></footer>
        </article>

        <article class="float-card card-client" data-depth="0.65" style="--delay: 0.7s">
            <header><span class="mono">CLIENT / ACTIVE</span><span class="mono">03</span></header>
            <strong>Кофейня «Зерно»</strong>
            <span class="mono muted">3 проекта · 12 задач</span>
            <footer class="client-row"><span class="avatar">К</span><span class="mono">с 2024</span></footer>
        </article>

        <article class="float-card card-invoice" data-depth="0.8" style="--delay: 0.9s">
            <header><span class="mono">INVOICE / 104</span><span class="status-pill warn">ждёт</span></header>
            <strong>−1 500,00 ₽</strong>
            <span class="mono muted">списание за задачу</span>
            <footer class="mini-lines"><i></i><i></i><i></i></footer>
        </article>

        <article class="float-card card-load" data-depth="0.55" style="--delay: 1.1s">
            <header><span class="mono">LOAD / WEEK 47</span><span class="mono">32</span></header>
            <div class="load-bars" aria-hidden="true">
                <i style="height:34%"></i><i style="height:62%"></i><i style="height:48%"></i><i style="height:88%" class="peak"></i><i style="height:54%"></i><i style="height:30%"></i><i style="height:40%"></i>
            </div>
            <footer><span class="mono">5+ = занято</span><span class="mono">ПТ</span></footer>
        </article>

        <article class="float-card card-balance" data-depth="0.7" style="--delay: 1.3s">
            <header><span class="mono">BALANCE / RUB</span><span class="status-dot green"></span></header>
            <strong>−1 500,00 ₽</strong>
            <span class="mono muted">в истории: KOR-18</span>
            <footer class="balance-spark" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></footer>
        </article>

    </div>

</div>
