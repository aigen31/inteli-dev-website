# inteli-dev.ru — Nginx как reverse proxy перед Rust-приложением (web:8080).
#
# TLS-терминация и выпуск сертификатов целиком на Traefik (labels в
# docker-compose.prod.yml): здесь только plain HTTP внутри docker-сети,
# наружу порт не публикуется.

# Реальный IP клиента: Traefik кладёт его в X-Forwarded-For. При прямом
# обращении (локальный тест без Traefik) заголовка нет — берём $remote_addr.
map $http_x_forwarded_for $inteli_client_ip {
    default $http_x_forwarded_for;
    ""      $remote_addr;
}

# Схема исходного запроса: Traefik отдаёт X-Forwarded-Proto.
map $http_x_forwarded_proto $inteli_scheme {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    listen [::]:80;
    server_name inteli-dev.ru www.inteli-dev.ru _;

    # Docker embedded DNS: чтобы nginx переразрешал имя `web` при пересоздании
    # контейнера приложения, а не держал устаревший IP до reload.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $inteli_upstream "http://web:8080";

    # Не показывать версию nginx в заголовке Server (краулер отметил раскрытие
    # технологий как «критическое» замечание; сам факт nginx — не секрет, а
    # версия подсказывает, какие уязвимости искать).
    server_tokens off;

    client_max_body_size 1m;

    # Сжатие сознательно НЕ здесь. Без brotli в образе nginx отдавал бы только
    # gzip, а Traefik (labels в docker-compose.prod.yml) уже умеет gzip, brotli и
    # zstd. Ответ с готовым `Content-Encoding` Traefik не пережимает, поэтому
    # `gzip on` здесь просто не давал бы brotli дойти до клиента — краулер так и
    # писал: «7 страниц без поддержки Brotli».

    # HSTS — транспортный заголовок, живёт рядом с проксированием. Остальные
    # заголовки безопасности (CSP с `frame-ancestors`, X-Content-Type-Options,
    # Referrer-Policy, Permissions-Policy, COOP/CORP) ставит приложение
    # (`src/security.rs`): CSP обязан содержать nonce конкретного ответа, а
    # nginx его не видит. Дублировать их здесь нельзя — `add_header` добавляет
    # заголовок вторым, и краулер видел в одном ответе `nosniff, nosniff`.
    #
    # `X-Frame-Options` не ставить ни здесь, ни где-либо ещё: он умеет только
    # `DENY`/`SAMEORIGIN`, а Метрике нужно открывать страницу в своём
    # конструкторе целей и Вебвизоре. Список источников выражается только через
    # `frame-ancestors` в CSP приложения — вернувшийся XFO снова сломает настройку
    # целей («Ошибка при загрузке страницы»).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $inteli_client_ip;
    proxy_set_header X-Forwarded-For $inteli_client_ip;
    proxy_set_header X-Forwarded-Proto $inteli_scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_send_timeout 120s;
    # Ответы LLM могут генерироваться долго — не рвём соединение раньше времени.
    proxy_read_timeout 120s;

    # ACME HTTP-01 обрабатывает сам Traefik, но путь оставляем рабочим.
    location ^~ /.well-known/ {
        proxy_pass $inteli_upstream;
    }

    # Скрытые файлы наружу не отдаём.
    location ~ /\. {
        deny all;
    }

    # Кэш статики настраивает приложение (`src/api/assets.rs`): адрес ресурса
    # несёт `?v=<хеш содержимого>`, поэтому год кэша разрешён только
    # версионированному адресу. `expires` здесь добавил бы второй
    # `Cache-Control` к ответу приложения — браузеры такой ответ трактуют
    # по-разному.
    location / {
        proxy_pass $inteli_upstream;
    }
}
